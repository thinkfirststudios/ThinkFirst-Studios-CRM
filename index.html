<!-- ── Application scripts ────────────────────────────────────────────
     Loaded through a version token because GitHub Pages serves these
     with Cache-Control: max-age=600. Without it, a reload in the ten
     minutes after a deploy quietly runs the PREVIOUS build — which looks
     exactly like the fix not working.

     BUMP CRM_BUILD ON EVERY CHANGE TO ANY FILE BELOW.

     The scripts are injected rather than written inline so the token
     lives in one place. `async = false` on a dynamically created script
     preserves execution order, which these files depend on. -->
<script>
(function () {
  var CRM_BUILD = '2026-08-18-10';
  window.CRM_BUILD = CRM_BUILD;
  [
    'js/config.js', 'js/backend.js', 'js/store.js', 'js/auth.js', 'js/ui.js',
    'js/views/dashboard.js', 'js/views/activities.js', 'js/views/record.js',
    'js/views/customers.js', 'js/views/contacts.js', 'js/views/opportunities.js',
    'js/views/leads.js', 'js/views/outreach.js', 'js/views/pipeline.js',
    'js/views/tracker.js', 'js/views/workorders.js', 'js/views/vendors.js',
    'js/views/billing.js', 'js/views/admin.js', 'js/app.js'
  ].forEach(function (src) {
    var s = document.createElement('script');
    s.src = src + '?v=' + CRM_BUILD;
    s.async = false;
    document.head.appendChild(s);
  });
})();
</script>
